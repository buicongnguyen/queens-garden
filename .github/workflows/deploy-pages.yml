name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: npm ci

      - name: Validate generated puzzles
        run: npm run verify

      - name: Verify committed renderer bundle
        run: |
          npm run build:renderer
          git diff --exit-code -- src/garden-renderer.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test game interactions and Blender export
        run: npm run test:browser

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css .nojekyll THIRD_PARTY_NOTICES.md _site/
          cp -r src _site/
          cp assets/favicon.png assets/queen-token-192.png assets/queen-garden-hero.webp _site/assets/
          cp assets/queen-token-real.png assets/queen-real.glb _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
